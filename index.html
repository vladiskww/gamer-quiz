<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamer Quiz</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <main class="app">
    <section id="start-screen" class="screen active">
      <h1>Gamer Quiz</h1>
      <p>Проверь, насколько хорошо ты знаешь игры.</p>
      <button id="btn-start" class="btn-main">Начать игру</button>
    </section>

    <section id="question-screen" class="screen">
      <div class="top-bar">
        <span id="counter">1/5</span>
        <span id="score">Очки: 0</span>
        <span id="combo">Комбо: 0</span>
      </div>
      <h2 id="question-text"></h2>
      <div id="options" class="options"></div>
    </section>

    <section id="explanation-screen" class="screen">
      <h2 id="verdict"></h2>
      <p id="explanation-text"></p>
      <button id="btn-next" class="btn-main">Следующий вопрос</button>
    </section>

    <section id="result-screen" class="screen">
      <h2>Раунд окончен</h2>
      <p id="final-score"></p>
      <button id="btn-restart" class="btn-main">Сыграть ещё</button>
    </section>
  </main>

  <script src="src/js/questions.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
